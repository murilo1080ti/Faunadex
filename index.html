<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Faunadex Arena</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .arena {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;

            /* O SEGREDO DO ARQUITETO - CSS Grid */
            display: grid;
            grid-template-columns: 150px 450px 150px;
            gap: 40px;
        }

        /* Transformando a Mão em um Grid de 5 linhas */
        .mao-aliado,
        .mao-inimigo {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            gap: 15px;
        }

        /* Desenhando a Carta - ATUALIZADO COM IMAGENS */
        .carta {
            background-image: url('https://placebear.com/150/200');
            background-size: cover;
            background-position: center;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }

        /* Efeito de Hover (passar o mouse) */
        .carta:hover {
            transform: scale(1.1);
            border-color: yellow;
        }

        /* Cartas do Inimigo ficam vermelhas */
        .carta.inimigo {
            background-image: url('https://placebear.com/150/201');
            border-color: #e94560;
        }

        /* Tabuleiro 3x3 */
        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            background-color: #0d1b2a;
            border: 3px solid #e94560;
            border-radius: 10px;
            padding: 15px;
        }

        .slot {
            background-color: #1b263b;
            border: 1px solid #415a77;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        /* Efeito ao passar o mouse */
        .slot:hover {
            background-color: #4CAF50;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- A CAIXA PAI (Onde tudo acontece) -->
    <div class="arena">

        <!-- MÃO DO ALIADO - PREENCHIDA POR JAVASCRIPT -->
        <div class="mao-aliado"></div>

        <!-- TABULEIRO 3x3 -->
        <div class="tabuleiro">
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
        </div>

        <!-- MÃO DO INIMIGO - PREENCHIDA POR JAVASCRIPT -->
        <div class="mao-inimigo"></div>

    </div>

    <!-- CÉREBRO DO JOGO -->
    <script>
        // ========================================
        // PASSO 2.3: BANCO DE DADOS DAS CARTAS
        // ========================================

        // Nosso Banco de Dados de Animais Aliados
        const bancoDeCartasAliadas = [
            { id: 1, nome: "Urso Alpha", forca: 8, img: "https://placebear.com/200/300" },
            { id: 2, nome: "Urso Beta", forca: 9, img: "https://placebear.com/200/301" },
            { id: 3, nome: "Urso Charlie", forca: 5, img: "https://placebear.com/200/302" },
            { id: 4, nome: "Urso Delta", forca: 6, img: "https://placebear.com/200/303" },
            { id: 5, nome: "Urso Echo", forca: 7, img: "https://placebear.com/200/304" }
        ];

        // Banco de Dados de Animais Inimigos
        const bancoDeCartasInimigas = [
            { id: 1, nome: "Aranha Gigante", forca: 12, img: "https://placebear.com/200/305" },
            { id: 2, nome: "Javali Furioso", forca: 15, img: "https://placebear.com/200/306" },
            { id: 3, nome: "Morcego Vampiro", forca: 9, img: "https://placebear.com/200/307" },
            { id: 4, nome: "Escorpião Rei", forca: 18, img: "https://placebear.com/200/308" },
            { id: 5, nome: "Crocodilo do Pântano", forca: 21, img: "https://placebear.com/200/309" }
        ];

        // ========================================
        // RENDERIZANDO AS CARTAS ALIADAS
        // ========================================
        const maoAliado = document.querySelector('.mao-aliado');

        bancoDeCartasAliadas.forEach(cartaDado => {
            let cartaElemento = document.createElement('div');
            cartaElemento.classList.add('carta');
            cartaElemento.style.backgroundImage = `url(${cartaDado.img})`;

            // Adiciona evento de clique
            cartaElemento.addEventListener('click', () => {
                alert("Você clicou na carta: " + cartaDado.nome + " com força " + cartaDado.forca);
            });

            maoAliado.appendChild(cartaElemento);
        });

        // ========================================
        // RENDERIZANDO AS CARTAS INIMIGAS
        // ========================================
        const maoInimigo = document.querySelector('.mao-inimigo');

        bancoDeCartasInimigas.forEach(cartaDado => {
            let cartaElemento = document.createElement('div');
            cartaElemento.classList.add('carta', 'inimigo');
            cartaElemento.style.backgroundImage = `url(${cartaDado.img})`;

            // Adiciona evento de clique
            cartaElemento.addEventListener('click', () => {
                alert("Você clicou na carta inimiga: " + cartaDado.nome + " com força " + cartaDado.forca);
            });

            maoInimigo.appendChild(cartaElemento);
        });
    </script>
</body>

</html>
